<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#881018" />
      <stop offset="60%" stop-color="#4A0808" />
      <stop offset="100%" stop-color="#240202" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <pattern id="mandala" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="28" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3,3" />
      <circle cx="40" cy="40" r="14" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" />
  <rect width="800" height="600" fill="url(#mandala)" />

  <!-- Outer Traditional Gold Borders -->
  <rect x="25" y="25" width="750" height="550" rx="20" fill="none" stroke="url(#gold)" stroke-width="3" />
  <rect x="35" y="35" width="730" height="530" rx="14" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.6" />

  <!-- Corner Paisley Ornaments -->
  <g fill="#D4AF37" opacity="0.8">
    <circle cx="45" cy="45" r="4" />
    <circle cx="755" cy="45" r="4" />
    <circle cx="45" cy="555" r="4" />
    <circle cx="755" cy="555" r="4" />
  </g>

  <!-- Top Toran Garland -->
  <g fill="#2D6A4F">
    <polygon points="50,35 65,75 80,35" />
    <polygon points="110,35 125,75 140,35" />
    <polygon points="170,35 185,75 200,35" />
    <polygon points="230,35 245,75 260,35" />
    <polygon points="290,35 305,75 320,35" />
    <polygon points="350,35 365,75 380,35" />
    <polygon points="410,35 425,75 440,35" />
    <polygon points="470,35 485,75 500,35" />
    <polygon points="530,35 545,75 560,35" />
    <polygon points="590,35 605,75 620,35" />
    <polygon points="650,35 665,75 680,35" />
    <polygon points="710,35 725,75 740,35" />
  </g>
  <g fill="#F59E0B">
    <circle cx="65" cy="78" r="7" />
    <circle cx="125" cy="78" r="7" />
    <circle cx="185" cy="78" r="7" />
    <circle cx="245" cy="78" r="7" />
    <circle cx="305" cy="78" r="7" />
    <circle cx="365" cy="78" r="7" />
    <circle cx="425" cy="78" r="7" />
    <circle cx="485" cy="78" r="7" />
    <circle cx="545" cy="78" r="7" />
    <circle cx="605" cy="78" r="7" />
    <circle cx="665" cy="78" r="7" />
    <circle cx="725" cy="78" r="7" />
  </g>

  <!-- Lord Ganesha Symbol -->
  <g transform="translate(365, 120)">
    <path d="M35 10L38 20H32L35 10Z" fill="url(#gold)" />
    <path d="M35 22V32" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" />
    <circle cx="35" cy="24" r="2" fill="#B91C1C" />
    <path d="M28 28C22 28 17 32 18 40C20 48 26 46 29 42" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M42 28C48 28 53 32 52 40C50 48 44 46 41 42" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M31 36C31 46 29 56 37 61C43 64 48 58 45 53C43 50 39 52 40 55" stroke="url(#gold)" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <circle cx="49" cy="46" r="3" fill="#F59E0B" />
  </g>

  <!-- Typography -->
  <text x="400" y="235" font-family="'Cinzel', serif, Georgia" font-size="20" font-weight="bold" fill="#F9E2AF" text-anchor="middle" letter-spacing="4">
    || ૐ શ્રી ગણેશાય નમઃ ||
  </text>
  <text x="400" y="265" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#E8C288" text-anchor="middle">
    || શ્રી કુળદેવી માતાયૈ નમઃ || શ્રી પિતૃદેવાય નમઃ ||
  </text>

  <!-- Title Badge -->
  <rect x="230" y="295" width="340" height="38" rx="19" fill="#380505" stroke="url(#gold)" stroke-width="1.8" />
  <text x="400" y="320" font-family="'Cinzel', serif, Georgia" font-size="15" font-weight="bold" fill="#F9E2AF" text-anchor="middle" letter-spacing="3">
    રાજવાડી કંકોત્રી • RAJWADI
  </text>

  <!-- Couple Names -->
  <text x="400" y="390" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    Riya Shah
  </text>
  <text x="400" y="430" font-family="'Dancing Script', cursive, serif" font-size="28" font-style="italic" fill="#F3C68F" text-anchor="middle">
    weds
  </text>
  <text x="400" y="485" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    Parth Patel
  </text>

  <!-- Auspicious Seal at Bottom -->
  <circle cx="400" cy="535" r="24" fill="url(#gold)" stroke="#FFF3CD" stroke-width="1.5" />
  <circle cx="400" cy="535" r="20" fill="#7A0C0C" />
  <text x="400" y="540" font-family="serif" font-size="11" font-weight="bold" fill="#F9E2AF" text-anchor="middle" letter-spacing="1">
    શુભ વિવાહ
  </text>
</svg>
